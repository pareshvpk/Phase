# Project-wide dependency and plugin versions.
# All versions are pinned to stable, mutually compatible releases.
# AGP 8.6.0 requires JDK 17 and supports compileSdk 35.
# Kotlin 2.0.0 ships its own Compose compiler plugin (org.jetbrains.kotlin.plugin.compose).
# Compose BOM 2024.12.01 (Compose UI 1.7.6; 1.7.0 crashed under monkey with a focus-system bug) aligns the Compose UI / Material 3 / Foundation artifacts.

[versions]
agp = "8.6.0"
kotlin = "2.0.0"
composeBom = "2024.12.01"
coreKtx = "1.12.0"
appcompat = "1.7.0"
activityCompose = "1.8.2"
lifecycleRuntimeCompose = "2.8.2"
lifecycleViewmodelCompose = "2.8.2"
junit = "4.13.2"
json = "20231013"
androidxTestRunner = "1.6.1"
androidxTestRules = "1.6.1"
androidxTestCore = "1.6.1"
androidxTestExtJunit = "1.1.5"
executorch = "1.5.1"

[libraries]
android-application = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-android = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
executorch-android = { module = "org.pytorch:executorch-android", version.ref = "executorch" }

# Compose libraries: versions come from the Compose BOM platform below.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-text = { group = "androidx.compose.ui", name = "ui-text" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
